<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    ZerDrakor icon ala Netflix: tile hitam #141414 dengan huruf "Z"
    pita merah (gaya ribbon logo N Netflix) — bar terang #F6121D→#C11119,
    diagonal bayangan #B1060F→#8A050C. Gradients pakai userSpaceOnUse
    karena bbox garis horizontal nol (gradient objectBoundingBox tidak
    ter-render di stroke garis lurus).
  -->
  <defs>
    <linearGradient id="barTop" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="184">
      <stop offset="0" stop-color="#F6121D"/>
      <stop offset="1" stop-color="#C11119"/>
    </linearGradient>
    <linearGradient id="barBottom" gradientUnits="userSpaceOnUse" x1="0" y1="328" x2="0" y2="392">
      <stop offset="0" stop-color="#F6121D"/>
      <stop offset="1" stop-color="#C11119"/>
    </linearGradient>
    <linearGradient id="diag" gradientUnits="userSpaceOnUse" x1="376" y1="152" x2="136" y2="360">
      <stop offset="0" stop-color="#B1060F"/>
      <stop offset="1" stop-color="#8A050C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#141414"/>
  <path d="M376 152 L136 360" stroke="url(#diag)" stroke-width="64" fill="none"/>
  <rect x="112" y="120" width="288" height="64" fill="url(#barTop)"/>
  <rect x="112" y="328" width="288" height="64" fill="url(#barBottom)"/>
</svg>
